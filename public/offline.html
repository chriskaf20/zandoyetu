<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>Hors ligne | Zando Yetu</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #fafafa;
      color: #0a0a0a;
      text-align: center;
    }
    main { max-width: 360px; }
    .logo {
      width: 56px; height: 56px; margin: 0 auto 16px;
      border-radius: 12px; background: #0a0a0a; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; letter-spacing: 1px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.5; color: #525252; margin: 0 0 20px; }
    button {
      appearance: none; border: 0; cursor: pointer;
      padding: 12px 20px; border-radius: 8px;
      background: #0a0a0a; color: #fff;
      font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    }
    small { display: block; margin-top: 16px; color: #a3a3a3; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">ZY</div>
    <h1>Pas de connexion</h1>
    <p>Impossible de joindre Zando Yetu pour le moment. Vérifiez vos données mobiles ou votre Wi-Fi, puis réessayez. Votre panier est conservé sur ce téléphone.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
    <small>Hakuna mtandao — jaribu tena baadaye.</small>
  </main>
  <script>
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
